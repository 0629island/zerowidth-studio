<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZeroWidth Studio Web</title><style>:root{color-scheme:light;--bg:#f5f6f8;--fg:#20232b;--panel:#fff;--border:#e0e4ea;--input-border:#cbd1da;--muted:#626a75;--button:#1d2532;--button-fg:#fff;--secondary:#e9edf2;--secondary-fg:#1d2532;--status:#345a76;--error:#a12d32}html[data-theme="dark"]{color-scheme:dark;--bg:#11151c;--fg:#ecf0f5;--panel:#1b222c;--border:#35404e;--input-border:#526071;--muted:#adb9c9;--button:#dbe7f5;--button-fg:#17202b;--secondary:#33404e;--secondary-fg:#f0f3f8;--status:#94c9ec;--error:#ff9ca2}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:850px;margin:35px auto;padding:0 18px}h1{margin-bottom:6px}.sub{color:var(--muted)}section{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:18px;margin:16px 0}label{display:block;font-weight:650;margin-bottom:8px}textarea{background:var(--panel);color:var(--fg);box-sizing:border-box;width:100%;min-height:125px;resize:vertical;padding:12px;border:1px solid var(--input-border);border-radius:9px;font:15px/1.55 system-ui,sans-serif}select{padding:10px;border:1px solid var(--input-border);border-radius:8px;width:100%;background:var(--panel);color:var(--fg)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}button{background:var(--button);color:var(--button-fg);border:0;border-radius:9px;padding:11px 17px;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.lang{width:auto;min-width:160px}button.secondary{background:var(--secondary);color:var(--secondary-fg)}#status{min-height:25px;color:var(--status);white-space:pre-wrap}.hint{font-size:13px;color:var(--muted)}</style></head><body><main class="wrap"><div class="top"><h1>ZeroWidth Studio</h1><div><label for="language" data-i18n="language">界面语言</label><select id="language" class="lang"><option value="zh">简体中文</option><option value="ja">日本語</option><option value="en">English</option></select><label for="theme" data-i18n="theme" style="margin-top:10px">外观模式</label><select id="theme" class="lang"><option value="system" data-i18n="system">跟随系统</option><option value="light" data-i18n="light">浅色模式</option><option value="dark" data-i18n="dark">深色模式</option></select></div></div><p class="sub" data-i18n="subtitle">在浏览器中嵌入、提取与清除零宽隐藏文字 · 数据仅在本地处理</p><section><label for="cover" data-i18n="cover">① 普通正文</label><textarea id="cover" data-placeholder="coverPlaceholder" placeholder="输入日语、中文或英文正文"></textarea></section><section><label for="secret" data-i18n="secret">② 隐藏消息</label><textarea id="secret" data-placeholder="secretPlaceholder" placeholder="输入想隐藏的文字"></textarea></section><section><label for="mode" data-i18n="mode">嵌入模式</label><select id="mode"><option value="end" data-i18n="end">末尾隐藏</option><option value="lines" data-i18n="lines">按行尾分散</option><option value="inline" selected data-i18n="inline">正文内部（标点后分散）</option></select><div class="actions"><button id="embed" data-i18n="embed">嵌入隐藏消息</button><button id="extract" class="secondary" data-i18n="extract">提取隐藏消息</button><button id="clean" class="secondary" data-i18n="clean">清除零宽字符</button></div><label for="output" data-i18n="output">③ 生成结果 / 待解码文本</label><textarea id="output" style="min-height:190px" data-placeholder="outputPlaceholder" placeholder="生成结果在这里；也可以粘贴其他文本尝试提取"></textarea><div class="actions"><button id="copy" data-i18n="copy">复制结果</button><button id="paste" class="secondary" data-i18n="paste">粘贴剪贴板到结果框</button></div><p id="status" role="status"></p><p class="hint" data-i18n="hint">兼容桌面版 ZW01 编码。复制到其他平台可能会丢失零宽字符；隐藏不等于加密。清除功能会删除常见零宽格式字符。</p></section></main><script>
'use strict';const ZERO='\u200c',ONE='\u200d',MAGIC=[90,87,48,49],encoder=new TextEncoder(),decoder=new TextDecoder('utf-8',{fatal:true});const $=id=>document.getElementById(id);const status=(s,err=false)=>{$('status').textContent=s;$('status').style.color=err?'#a12d32':'#345a76'};
function u32(n){return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]};function read32(a,i){return ((a[i]*16777216)+(a[i+1]<<16)+(a[i+2]<<8)+a[i+3])>>>0}
const crcTable=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();function crc32(a){let c=0xffffffff;for(const x of a)c=crcTable[(c^x)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function encode(msg){let data=encoder.encode(msg);if(data.length>10000000)throw Error('消息过长');let bytes=[...MAGIC,...u32(data.length),...data,...u32(crc32(data))];return bytes.map(b=>Array.from({length:8},(_,i)=>(b&(1<<(7-i)))?ONE:ZERO).join('')).join('')}
function decode(text){let bits=Array.from(text).filter(c=>c===ZERO||c===ONE).map(c=>c===ONE?'1':'0').join('');if(bits.length<96)throw Error('没有找到完整的隐藏消息');let bytes=[];for(let i=0;i+8<=bits.length;i+=8)bytes.push(parseInt(bits.slice(i,i+8),2));let start=-1;for(let i=0;i<=bytes.length-12;i++){if(MAGIC.every((x,j)=>bytes[i+j]===x)){start=i;break}}if(start<0)throw Error('未找到 ZW01 编码标识');let size=read32(bytes,start+4);if(size>10000000)throw Error('隐藏消息长度异常');let end=start+8+size;if(bytes.length<end+4)throw Error('隐藏消息不完整');let data=bytes.slice(start+8,end);if(read32(bytes,end)!==crc32(data))throw Error('校验失败：隐藏消息可能已损坏');return decoder.decode(new Uint8Array(data))}
function distribute(cover,encoded,positions){if(!positions.length)throw Error('正文没有合适的插入位置，请改用其他模式');let base=Math.floor(encoded.length/positions.length),extra=encoded.length%positions.length,out='',prev=0,cursor=0;positions.forEach((p,i)=>{let n=base+(i<extra?1:0);out+=cover.slice(prev,p)+encoded.slice(cursor,cursor+n);prev=p;cursor+=n});return out+cover.slice(prev)}
function embedText(cover,secret,mode){if(!cover||!secret)throw Error('请填写正文和隐藏消息');if(cover.includes(ZERO)||cover.includes(ONE))throw Error('正文已含编码字符，请先清理');let encoded=encode(secret);if(mode==='end')return cover+encoded;if(mode==='lines'){let positions=[];const re=/\r\n|\r|\n/g;let m;while((m=re.exec(cover))!==null)positions.push(m.index);if(!positions.length||positions[positions.length-1]!==cover.length)positions.push(cover.length);return distribute(cover,encoded,positions)}let positions=[];for(let i=0;i<cover.length-1;i++)if('。、！？；：.!?;:'.includes(cover[i])&&!('\r\n'.includes(cover[i+1])))positions.push(i+1);if(!positions.length){for(let i=1;i<cover.length;i++)if(cover[i]==='\n'||cover[i]==='\r')positions.push(i)}return distribute(cover,encoded,positions)}
const translations={

const languagePreferenceKey='zwstudio.language',themePreferenceKey='zwstudio.theme';
function detectLanguage(){let lang=(navigator.languages&&navigator.languages[0]||navigator.language||'en').toLowerCase();return lang.startsWith('zh')?'zh':lang.startsWith('ja')?'ja':'en'}
function safeGet(key){try{return localStorage.getItem(key)}catch(e){return null}}
function safeSet(key,value){try{localStorage.setItem(key,value)}catch(e){}}
let currentLanguage='zh';
const systemTheme=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const choice=$('theme').value;document.documentElement.dataset.theme=choice==='system'?(systemTheme.matches?'dark':'light'):choice}
$('theme').addEventListener('change',e=>{safeSet(themePreferenceKey,e.target.value);applyTheme()});
if(systemTheme.addEventListener)systemTheme.addEventListener('change',()=>{if($('theme').value==='system')applyTheme()});
else if(systemTheme.addListener)systemTheme.addListener(()=>{if($('theme').value==='system')applyTheme()});
function t(key){return translations[currentLanguage][key]}
function setLanguage(lang){currentLanguage=translations[lang]?lang:'zh';document.documentElement.lang=({zh:'zh-CN',ja:'ja',en:'en'})[currentLanguage];document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll('[data-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.placeholder)});document.title='ZeroWidth Studio';status('')}
$('language').addEventListener('change',e=>{setLanguage(e.target.value);safeSet(languagePreferenceKey,e.target.value)});
function translatedError(e){let key={'请填写正文和隐藏消息':'empty','消息过长':'tooLong','没有找到完整的隐藏消息':'noMessage','未找到 ZW01 编码标识':'noMagic','隐藏消息长度异常':'badLength','隐藏消息不完整':'incomplete','校验失败：隐藏消息可能已损坏':'badCrc','正文没有合适的插入位置，请改用其他模式':'noPosition','正文已含编码字符，请先清理':'existing','自动校验失败':'verification'}[e.message];return key?t(key):e.message}
$('embed').onclick=()=>{try{let s=$('secret').value,r=embedText($('cover').value,s,$('mode').value);if(decode(r)!==s)throw Error('自动校验失败');$('output').value=r;status(t('success')(Array.from(s).length,Array.from(r).filter(c=>c===ZERO||c===ONE).length))}catch(e){status(translatedError(e),true)}};
$('extract').onclick=()=>{try{let s=decode($('output').value);$('secret').value=s;status(t('extracted'))}catch(e){status(translatedError(e),true)}};
$('clean').onclick=()=>{let before=$('output').value,after=before.replace(/[\u200b\u200c\u200d\ufeff\u2060]/g,'');$('output').value=after;status(t('cleaned')(before.length-after.length))};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);status(t('copied'))}catch(e){$('output').focus();$('output').select();status(t('copyFail'),true)}};
$('paste').onclick=async()=>{try{$('output').value=await navigator.clipboard.readText();status(t('pasted'))}catch(e){status(t('pasteFail'),true)}};
const initialLanguage=safeGet(languagePreferenceKey)||detectLanguage();$('language').value=translations[initialLanguage]?initialLanguage:'en';setLanguage($('language').value);
const initialTheme=safeGet(themePreferenceKey);$('theme').value=['system','light','dark'].includes(initialTheme)?initialTheme:'system';applyTheme();
</script></body></html>
